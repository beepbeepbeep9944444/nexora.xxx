<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- product photos are hot-linked from Weidian/Taobao CDNs, which reject foreign referrers -->
<meta name="referrer" content="no-referrer">
<title>Archive Index</title>
<script>
  // apply a saved theme before first paint; without one the site follows the system setting
  try { const t = localStorage.getItem("ai-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="#" aria-label="Archive Index home">ARCHIVE<span>INDEX</span></a>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search for anything" autocomplete="off">
    </form>
    <nav class="top-links">
      <a href="#sheets">Sheets</a>
      <a href="#" id="favLink">Favorites <span id="favCount"></span></a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="dept-bar">
    <div class="dept-inner" id="deptBar"></div>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="foot-inner">
    <span>Archive Index</span>
    <span id="footStats"></span>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
